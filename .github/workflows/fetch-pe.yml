name: Fetch Daily PE Data
 
on:
  schedule:
    - cron: '0 11 * * 1-5'  # 6 AM ET = 11 AM UTC, Mon-Fri only
  workflow_dispatch:          # allows manual trigger from GitHub UI
 
jobs:
  fetch-pe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
 
      - name: Install dependencies
        run: npm install node-fetch@3
 
      - name: Fetch PE data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/fetch-pe.js
 
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily PE snapshot $(date -u '+%Y-%m-%d')"
          git push
 
